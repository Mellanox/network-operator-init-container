name: "Build, Test, Lint"
on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    uses: Mellanox/cloud-orchestration-reusable-workflows/.github/workflows/go-ci-reusable.yml@main
    with:
      go-version: 1.26.x
      build-command: make build
      lint-command: make lint
      test-command: make unit-test
      coverage-file: cover.out
      validate-command: |
        go mod tidy
        git diff --exit-code
  build-image:
    uses: Mellanox/cloud-orchestration-reusable-workflows/.github/workflows/image-build-reusable.yml@main
    with:
      build-args: |
        GOPROXY=https://proxy.golang.org,direct
